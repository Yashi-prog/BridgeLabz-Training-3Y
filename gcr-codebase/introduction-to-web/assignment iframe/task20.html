<!DOCTYPE html>
<html>
<head>

    <!-- title defines the title shown on the browser tab -->
    <title>Important Head Elements</title>

    <!-- meta charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- meta description provides a description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements">

    <!-- meta author specifies the author of the webpage -->
    <meta name="author" content="Yashi Agrawal">

    <!-- base sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- link connects the webpage to an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style is used to add CSS to the webpage; it is empty here -->
    <style>
    </style>

    <!-- script is used to add JavaScript; it is empty here -->
    <script>
    </script>

</head>
<body>

    <h1>Important Head Elements</h1>

    <p>
        This webpage demonstrates important HTML head elements.
    </p>

</body>
</html>
