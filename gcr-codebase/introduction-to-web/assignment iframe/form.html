<!DOCTYPE html>
<html>
<head>
    <title>Form Page</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" target="resultFrame">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <input type="submit" value="Submit">
    </form>

    <br>

    <!-- Result page will be displayed inside this iframe -->
    <iframe
        name="resultFrame"
        width="80%"
        height="200">
    </iframe>

</body>
</html>
