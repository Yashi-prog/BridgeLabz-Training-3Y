<!DOCTYPE html>
<html>
<head>
    <title>My City Map</title>
</head>
<body>

    <!-- Google Map embedded using iframe -->
    <h1>My City</h1>

    <iframe
        title="Google Map showing my city"
        src="https://www.google.com/maps?q=Mathura,Uttar+Pradesh&output=embed"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

    <!-- loading="lazy" loads the map only when it is close to being visible on the screen. -->

</body>
</html>
