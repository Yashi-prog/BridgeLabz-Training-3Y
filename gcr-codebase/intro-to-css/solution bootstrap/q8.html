
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .pricing-card {
            height: 100%;
            transition: 0.3s;
        }

        .pricing-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .price {
            font-size: 32px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container py-5">

        <h1 class="text-center mb-2">Choose Your Plan</h1>
        <p class="text-center text-muted mb-5">
            Select the best plan for your needs.
        </p>

        <div class="row g-4">

            <!-- Basic Plan -->
            <div class="col-md-4">
                <div class="card pricing-card shadow-sm text-center">

                    <div class="card-body p-4">
                        <h3>Basic</h3>
                        <p class="price">₹499</p>
                        <p class="text-muted">Per Month</p>

                        <hr>

                        <p>5 Projects</p>
                        <p>Email Support</p>
                        <p>Basic Features</p>

                        <button class="btn btn-outline-primary">
                            Choose Plan
                        </button>
                    </div>

                </div>
            </div>

            <!-- Pro Plan -->
            <div class="col-md-4">
                <div class="card pricing-card bg-primary text-white shadow-sm text-center">

                    <div class="card-body p-4">
                        <h3>Pro</h3>
                        <p class="price">₹999</p>
                        <p>Per Month</p>

                        <hr>

                        <p>20 Projects</p>
                        <p>Priority Support</p>
                        <p>All Features</p>

                        <button class="btn btn-light text-primary">
                            Choose Plan
                        </button>
                    </div>

                </div>
            </div>

            <!-- Premium Plan -->
            <div class="col-md-4">
                <div class="card pricing-card shadow-sm text-center">

                    <div class="card-body p-4">
                        <h3>Premium</h3>
                        <p class="price">₹1499</p>
                        <p class="text-muted">Per Month</p>

                        <hr>

                        <p>Unlimited Projects</p>
                        <p>24/7 Support</p>
                        <p>Advanced Features</p>

                        <button class="btn btn-outline-primary">
                            Choose Plan
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>

</body>
</html>
