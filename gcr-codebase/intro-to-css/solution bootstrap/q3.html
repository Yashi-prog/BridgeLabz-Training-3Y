
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .product-card {
            transition: 0.3s;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            height: 200px;
            object-fit: cover;
        }

        .price {
            color: #198754;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white text-center p-4">
        <h1>My Product Store</h1>
        <p class="mb-0">Explore Our Latest Products</p>
    </header>

    <!-- Product Catalog -->
    <section class="container py-5">

        <h2 class="text-center fw-bold mb-4">
            Our Products
        </h2>

        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">

                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                         class="card-img-top"
                         alt="Headphones">

                    <div class="card-body text-center">
                        <h5 class="card-title">Headphones</h5>
                        <p class="price">₹1,499</p>
                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">

                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
                         class="card-img-top"
                         alt="Watch">

                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="price">₹2,999</p>
                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">

                    <img src="https://images.unsplash.com/photo-1503602642458-232111445657?w=500"
                         class="card-img-top"
                         alt="Chair">

                    <div class="card-body text-center">
                        <h5 class="card-title">Modern Chair</h5>
                        <p class="price">₹3,499</p>
                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">

                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
                         class="card-img-top"
                         alt="Shoes">

                    <div class="card-body text-center">
                        <h5 class="card-title">Sports Shoes</h5>
                        <p class="price">₹1,999</p>
                        <button class="btn btn-primary">
                            Add to Cart
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 My Product Store</p>
    </footer>

</body>
</html>
