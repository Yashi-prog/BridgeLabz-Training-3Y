
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            max-width: 900px;
            margin: 40px auto;
        }

        .summary {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>

    <div class="container dashboard">

        <h1 class="text-center mb-4">Notifications Dashboard</h1>

        <!-- Success Alert -->
        <div class="alert alert-success alert-dismissible fade show">
            <strong>Success!</strong> Your new message has arrived.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Information Alert -->
        <div class="alert alert-info alert-dismissible fade show">
            <strong>Information!</strong> A new system update is available.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Danger Alert -->
        <div class="alert alert-danger alert-dismissible fade show">
            <strong>Warning!</strong> Please check your account details.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Summary Section -->
        <section class="summary mt-4">
            <h3>Notification Summary</h3>

            <div class="row mt-3">
                <div class="col-md-4">
                    <div class="card text-center p-3">
                        <h4>5</h4>
                        <p class="mb-0">New Messages</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card text-center p-3">
                        <h4>3</h4>
                        <p class="mb-0">System Updates</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card text-center p-3">
                        <h4>2</h4>
                        <p class="mb-0">Warnings</p>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Bootstrap JS for dismissible alerts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
