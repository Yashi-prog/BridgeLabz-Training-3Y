
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Portfolio</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border: 5px solid white;
        }

        .portfolio-header {
            background-color: #e9ecef;
        }

        .btn {
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        footer {
            background-color: #212529;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <header class="portfolio-header text-center p-5">
        <div class="container">
            <h1 class="fw-bold text-dark">Your Name</h1>
            <p class="lead mb-0">Web Developer | Student | Programmer</p>
        </div>
    </header>

    <!-- About Section -->
    <section class="container text-center mt-4 mb-5">

        <img src="https://via.placeholder.com/180"
             class="img-fluid rounded-circle profile-img"
             alt="Profile Image">

        <h2 class="fw-bold mt-4">About Me</h2>

        <p class="text-muted mt-3">
            Hello! I am a student interested in web development
            and programming. I enjoy learning new technologies
            and creating useful websites.
        </p>

        <!-- Buttons -->
        <a href="mailto:yourmail@example.com"
           class="btn btn-primary mt-3 me-2">
            Hire Me
        </a>

        <a href="cv.pdf"
           class="btn btn-outline-dark mt-3">
            Download CV
        </a>

    </section>

    <!-- Contact Form -->
    <section class="container mb-5">

        <div class="bg-light p-5 rounded shadow-sm">

            <h2 class="text-center fw-bold mb-4">
                Contact Me
            </h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email"
                           class="form-control"
                           placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control"
                              rows="4"
                              placeholder="Write your message"></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>
                </div>

            </form>
        </div>

    </section>

    <!-- Footer -->
    <footer class="text-center p-3">
        <p class="mb-0">
            © 2026 Your Name | My Portfolio
        </p>
    </footer>

</body>
</html>
