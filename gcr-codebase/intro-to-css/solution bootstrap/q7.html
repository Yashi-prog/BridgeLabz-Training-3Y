
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .task-container {
            max-width: 750px;
            margin: 50px auto;
        }

        .list-group-item {
            padding: 18px;
        }
    </style>
</head>
<body>

    <div class="container task-container">

        <h1 class="text-center mb-4">
            Task Tracker
            <span class="badge bg-primary">4 Pending</span>
        </h1>

        <div class="list-group">

            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Complete Project Report</span>
                <span class="badge bg-danger">High</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Prepare Presentation</span>
                <span class="badge bg-warning text-dark">Medium</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Read Assignment</span>
                <span class="badge bg-success">Low</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Submit College Work</span>
                <span class="badge bg-danger">High</span>
            </div>

        </div>

        <div class="text-center mt-4">
            <button class="btn btn-success">
                Completed <span class="badge bg-light text-dark">2</span>
            </button>
        </div>

    </div>

</body>
</html>
