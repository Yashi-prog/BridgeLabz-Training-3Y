<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>Menu</h2>

            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <main class="content">

            <h2>Welcome Back!</h2>

            <div class="boxes">

                <div class="box">
                    <h3>Total Projects</h3>
                    <p class="number">12</p>
                    <p>Projects completed so far.</p>
                </div>

                <div class="box">
                    <h3>Tasks Completed</h3>
                    <p class="number">48</p>
                    <p>Tasks successfully completed.</p>
                </div>

                <div class="box">
                    <h3>Pending Tasks</h3>
                    <p class="number">7</p>
                    <p>Tasks waiting to be completed.</p>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
