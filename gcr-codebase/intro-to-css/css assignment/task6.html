<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="task6.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments captured through photographs</p>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="image1.webp" alt="Sunset">
            <div class="caption">Beautiful Sunset</div>
        </div>

        <div class="photo">
            <img src="image2.webp" alt="Mountains">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="image3.jpg" alt="Beach">
            <div class="caption">Peaceful Beach</div>
        </div>

        <div class="photo">
            <img src="image4.jpg" alt="Flowers">
            <div class="caption">Colorful Flowers</div>
        </div>

        <div class="photo">
            <img src="image5.jpg" alt="Lights">
            <div class="caption">City Lights</div>
        </div>

        <div class="photo">
            <img src="image6.jpg" alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

    </main>

    <footer>
        <p>© 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
