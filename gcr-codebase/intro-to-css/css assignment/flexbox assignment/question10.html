<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question 10 - Complete Mini UI</title>

    <link rel="stylesheet" href="question10.css">
</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="site-header">

        <div class="header-content">

            <h1>My Mini UI</h1>

            <nav aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main id="home">

        <section class="main-section">

            <article class="content-card">

                <!-- Small image -->
                <div class="image-container">

                    <img
                        src="https://picsum.photos/400/220"
                        alt="Decorative landscape"
                    >

                </div>


                <!-- Card content -->
                <div class="card-content">

                    <h2>Welcome to My Page</h2>

                    <p>
                        This mini UI demonstrates different CSS concepts
                        including Flexbox, forms, buttons, borders,
                        shadows, hover effects and responsive design.
                    </p>


                    <!-- =========================
                         FORM
                         ========================= -->

                    <form class="contact-form">

                        <div class="form-group">

                            <label for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your name"
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                            >

                        </div>


                        <div class="form-group">

                            <label for="message">
                                Message
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="4"
                                placeholder="Write your message..."
                            ></textarea>

                        </div>


                        <!-- Form buttons -->
                        <div class="form-buttons">

                            <button
                                type="submit"
                                class="submit-btn"
                            >
                                Submit
                            </button>

                            <button
                                type="reset"
                                class="reset-btn"
                            >
                                Reset
                            </button>

                        </div>

                    </form>

                </div>

            </article>

        </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="site-footer">

        <p>
            &copy; 2026 My Mini UI | Assignment 8 - Question 10
        </p>

    </footer>

</body>
</html>
