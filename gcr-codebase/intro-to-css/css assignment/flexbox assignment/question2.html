<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Tooltip Demonstration</title>

    <link rel="stylesheet" href="question2.css">
</head>

<body>

    <!-- Page Header -->
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip-box">

                <span class="tooltip-element">
                    🔍
                    <span class="tooltip-text">
                        Search
                    </span>
                </span>

            </div>


            <!-- Tooltip 2 -->
            <div class="tooltip-box">

                <span class="tooltip-element">
                    💡
                    <span class="tooltip-text">
                        Helpful Tip
                    </span>
                </span>

            </div>


            <!-- Tooltip 3 -->
            <div class="tooltip-box">

                <span class="tooltip-element">
                    ⭐
                    <span class="tooltip-text">
                        Favorite
                    </span>
                </span>

            </div>


            <!-- Tooltip 4 -->
            <div class="tooltip-box">

                <span class="tooltip-element">
                    ⚙️
                    <span class="tooltip-text">
                        Settings
                    </span>
                </span>

            </div>


            <!-- Tooltip 5 -->
            <div class="tooltip-box">

                <span class="tooltip-element">
                    🔔
                    <span class="tooltip-text">
                        Notifications
                    </span>
                </span>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Assignment 8 - Question 2</p>
    </footer>

</body>

</html>
