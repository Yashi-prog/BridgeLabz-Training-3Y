<body>

    <header>
        <h1>Combined CSS Effects</h1>
        <p>Pseudo-classes, transitions and transformations</p>
    </header>

    <main>
        <section class="button-section">

            <article class="effect-card">
                <h2>Button Effects</h2>

                <p>
                    Hover over the buttons to see the combined
                    transition and transformation effects.
                </p>

                <div class="button-container">

                    <button class="effect-button primary">
                        Hover Me
                    </button>

                    <button class="effect-button secondary">
                        Try Me
                    </button>

                    <button class="effect-button outline">
                        Click Me
                    </button>

                </div>
            </article>

        </section>
    </main>
