<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Styled Button Collection</title>

    <link rel="stylesheet" href="question5.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="button-section">

            <h2>Button Styles</h2>

            <div class="button-container">

                <!-- Primary Button -->
                <button class="btn primary">
                    Primary Button
                </button>


                <!-- Secondary Button -->
                <button class="btn secondary">
                    Secondary Button
                </button>


                <!-- Outline Button -->
                <button class="btn outline">
                    Outline Button
                </button>


                <!-- Disabled Button -->
                <button class="btn disabled" disabled>
                    Disabled Button
                </button>

            </div>


            <!-- Focus Demonstration -->
            <div class="focus-info">
                <h2>:focus Demonstration</h2>

                <p>
                    Click on a button or use the Tab key to see
                    the focus effect.
                </p>
            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Assignment 8 - Question 5</p>
    </footer>

</body>

</html>
