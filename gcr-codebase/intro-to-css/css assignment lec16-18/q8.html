<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

<header>
    <h1>CSS Box Model</h1>
</header>

<main class="container">

    <div class="margin-layer">
        <div class="border-layer">
            <div class="padding-layer">
                <div class="content-layer">
                    Content
                </div>
            </div>
        </div>
    </div>

    <section class="description">
        <p><strong>Content:</strong> Actual text or element.</p>
        <p><strong>Padding:</strong> Space around content.</p>
        <p><strong>Border:</strong> Line surrounding padding.</p>
        <p><strong>Margin:</strong> Space outside the border.</p>
    </section>

</main>

</body>
</html>
