
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
        <p>A Collection of Beautiful Places</p>
    </header>

    <main class="gallery">

        <figure>
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Mountain">
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700" alt="Beach">
            </div>
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure>
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Lake">
            </div>
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Forest">
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=700" alt="Snowy Mountain">
            </div>
            <figcaption>Snowy Peaks</figcaption>
        </figure>

        <figure>
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=700" alt="Sunrise">
            </div>
            <figcaption>Golden Sunrise</figcaption>
        </figure>

    </main>

    <footer>
        <p>CSS Assignment 8 - Question 3</p>
    </footer>

</body>
</html>
