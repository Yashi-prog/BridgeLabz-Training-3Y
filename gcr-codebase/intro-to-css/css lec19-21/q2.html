
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main class="tooltip-container">

        <div class="tip-wrap">
            <span class="item">Home</span>
            <span class="tooltip">Go to Homepage</span>
        </div>

        <div class="tip-wrap">
            <span class="item">Profile</span>
            <span class="tooltip">View Your Profile</span>
        </div>

        <div class="tip-wrap">
            <span class="item">Settings</span>
            <span class="tooltip">Change Preferences</span>
        </div>

        <div class="tip-wrap">
            <span class="item">Help</span>
            <span class="tooltip">Get Assistance</span>
        </div>

    </main>

    <footer>
        <p>CSS Assignment 8 - Question 2</p>
    </footer>

</body>
</html>
