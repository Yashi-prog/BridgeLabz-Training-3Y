
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <h1>My Mini UI</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section class="main-card">

            <img
                src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=700"
                alt="Workspace"
            >

            <div class="content">
                <h2>Welcome!</h2>
                <p>Fill out the form to get in touch with us.</p>

                <!-- Contact Form -->
                <form>
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <div class="actions">
                        <button type="submit">Submit</button>
                        <button type="reset" class="reset">Reset</button>
                    </div>
                </form>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Mini UI - CSS Assignment 8</p>
    </footer>

</body>
</html>
