
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <header>
        <h1>Image Filter Comparison</h1>
        <p>Before and After CSS Filter Effects</p>
    </header>

    <main>
        <section class="comparison">

            <!-- Original Image -->
            <div class="image-box">
                <img src="https://picsum.photos/id/1015/500/350"
                     alt="Original mountain landscape">

                <h2>Before - Original Image</h2>
            </div>

            <!-- Filtered Image -->
            <div class="image-box">
                <img class="filtered"
                     src="https://picsum.photos/id/1015/500/350"
                     alt="Filtered mountain landscape">

                <h2>After - Filtered Image</h2>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Assignment 9 - Question 8</p>
    </footer>

</body>
</html>
